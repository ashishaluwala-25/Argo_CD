apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghost-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm-store
    kind: ClusterSecretStore
  target:
    name: ghost-secrets
    creationPolicy: Owner
  data:
    - secretKey: ghost-password
      remoteRef:
        key: /ghost/ghost-password
    - secretKey: mysql-root-password
      remoteRef:
        key: /ghost/mysql-root-password
    - secretKey: mysql-password
      remoteRef:
        key: /ghost/mysql-password
