apiVersion: v1
kind: PersistentVolume
metadata:
  name: ghost-efs-pv
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-027cb2eae66692cec
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-uploads-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: ghost-efs-pv
  resources:
    requests:
      storage: 100Gi
